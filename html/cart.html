<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Cart | CasaVibe</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <a href="index.html" class="logo">
        Casa<span>Vibe</span>
    </a>


    <nav class="navbar">

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Shop
        </a>

        <a href="index.html#collections">
            Collections
        </a>

        <a href="index.html#about">
            About
        </a>

    </nav>


    <div class="header-actions">

        <a
            href="products.html"
            class="icon-btn"
        >
            ←
        </a>


        <a
            href="cart.html"
            class="cart-btn"
        >
            🛒
            <span id="cart-count">0</span>
        </a>

    </div>

</header>



<!-- ================= CART ================= -->

<main class="cart-page">

    <h1>
        Your Cart
    </h1>


    <div class="cart-layout">


        <!-- CART PRODUCTS -->

        <div id="cart-items"></div>


        <!-- SUMMARY -->

        <aside class="cart-summary">

            <h2>
                Summary
            </h2>


            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <span id="cart-subtotal">
                    ₪0
                </span>

            </div>


            <div class="summary-row">

                <span>
                    Delivery
                </span>

                <span>
                    Free
                </span>

            </div>


            <div class="summary-row summary-total">

                <span>
                    Total
                </span>

                <span id="cart-total">
                    ₪0
                </span>

            </div>


            <a
                href="checkout.html"
                class="checkout-btn"
                style="
                    display:block;
                    text-align:center;
                "
            >
                Proceed to Checkout →
            </a>

        </aside>

    </div>

</main>



<!-- ================= FOOTER ================= -->

<footer class="footer">

    <div>

        <a href="index.html" class="logo">
            Casa<span>Vibe</span>
        </a>

        <p>
            Furniture for beautiful everyday living.
        </p>

    </div>


    <div class="footer-links">

        <a href="products.html">
            Shop
        </a>

        <a href="index.html#collections">
            Collections
        </a>

        <a href="index.html#about">
            About
        </a>

        <a href="cart.html">
            Cart
        </a>

    </div>


    <p class="copyright">
        © 2026 CasaVibe. All rights reserved.
    </p>

</footer>



<!-- ================= CART JAVASCRIPT ================= -->

<script>

let cart =
    JSON.parse(
        localStorage.getItem("casaCart")
    ) || [];



/* ================= SAVE ================= */

function saveCart() {

    localStorage.setItem(
        "casaCart",
        JSON.stringify(cart)
    );

}



/* ================= DISPLAY ================= */

function displayCart() {

    const container =
        document.getElementById("cart-items");


    container.innerHTML = "";


    /* EMPTY CART */

    if (cart.length === 0) {

        container.innerHTML = `

            <div style="
                text-align:center;
                padding:70px 20px;
            ">

                <h2 style="
                    font-family:'Playfair Display',serif;
                    font-size:35px;
                    margin-bottom:15px;
                ">
                    Your cart is empty.
                </h2>

                <p style="
                    color:#888;
                    margin-bottom:25px;
                ">
                    Discover something beautiful
                    for your home.
                </p>

                <a
                    href="products.html"
                    class="primary-btn"
                >
                    Continue Shopping →
                </a>

            </div>

        `;

        updateTotals();

        updateCount();

        return;
    }



    /* PRODUCTS */

    cart.forEach(function(item, index) {

        const div =
            document.createElement("div");


        div.className =
            "cart-item";


        div.innerHTML = `

            <img
                src="${item.image}"
                alt="${item.name}"
            >


            <div>

                <h3>
                    ${item.name}
                </h3>


                <p>
                    ₪${Number(item.price).toLocaleString()}
                </p>


                <!-- QUANTITY -->

                <div style="
                    display:flex;
                    align-items:center;
                    gap:12px;
                    margin-top:15px;
                ">


                    <button
                        type="button"
                        onclick="decreaseItem(${index})"
                        style="
                            width:40px;
                            height:40px;
                            font-size:22px;
                            cursor:pointer;
                            border:1px solid #ccc;
                            background:white;
                        "
                    >
                        −
                    </button>


                    <span style="
                        min-width:25px;
                        text-align:center;
                        font-weight:bold;
                        font-size:17px;
                    ">
                        ${item.quantity}
                    </span>


                    <button
                        type="button"
                        onclick="increaseItem(${index})"
                        style="
                            width:40px;
                            height:40px;
                            font-size:22px;
                            cursor:pointer;
                            border:1px solid #ccc;
                            background:white;
                        "
                    >
                        +
                    </button>


                </div>


                <!-- REMOVE -->

                <button
                    type="button"
                    onclick="deleteItem(${index})"
                    style="
                        margin-top:15px;
                        cursor:pointer;
                        border:none;
                        background:none;
                        padding:0;
                        text-decoration:underline;
                    "
                >
                    Remove
                </button>

            </div>


            <!-- ITEM TOTAL -->

            <div class="cart-price">

                ₪${(
                    Number(item.price) *
                    Number(item.quantity)
                ).toLocaleString()}

            </div>

        `;


        container.appendChild(div);

    });


    updateTotals();

    updateCount();

}



/* ================= PLUS ================= */

function increaseItem(index) {

    if (!cart[index]) return;


    cart[index].quantity =
        Number(cart[index].quantity) + 1;


    saveCart();

    displayCart();

}



/* ================= MINUS ================= */

function decreaseItem(index) {

    if (!cart[index]) return;


    cart[index].quantity =
        Number(cart[index].quantity) - 1;


    /* DELETE WHEN ZERO */

    if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

    }


    saveCart();

    displayCart();

}



/* ================= DELETE ================= */

function deleteItem(index) {

    if (!cart[index]) return;


    cart.splice(index, 1);


    saveCart();

    displayCart();

}



/* ================= TOTAL ================= */

function updateTotals() {

    let total = 0;


    cart.forEach(function(item) {

        total +=
            Number(item.price) *
            Number(item.quantity);

    });


    document.getElementById(
        "cart-subtotal"
    ).textContent =
        "₪" + total.toLocaleString();


    document.getElementById(
        "cart-total"
    ).textContent =
        "₪" + total.toLocaleString();

}



/* ================= CART COUNT ================= */

function updateCount() {

    let count = 0;


    cart.forEach(function(item) {

        count +=
            Number(item.quantity);

    });


    document.getElementById(
        "cart-count"
    ).textContent = count;

}



/* ================= START ================= */

displayCart();

updateCount();

</script>


</body>

</html>
