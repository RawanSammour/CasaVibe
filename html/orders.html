<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orders | CasaVibe</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>

    .orders-page {
        padding: 120px 7% 80px;
        min-height: 80vh;
    }

    .orders-header {
        max-width: 1200px;
        margin: 0 auto 45px;
    }

    .orders-header h1 {
        font-family: "Playfair Display", serif;
        font-size: 52px;
        margin: 10px 0;
    }

    .orders-header p {
        color: #777;
    }

    .orders-container {
        max-width: 1200px;
        margin: auto;
    }

    .order-card {
        border: 1px solid #ddd;
        padding: 30px;
        margin-bottom: 25px;
        background: #fff;
    }

    .order-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        border-bottom: 1px solid #eee;
        padding-bottom: 20px;
        margin-bottom: 20px;
    }

    .order-number {
        font-family: "Playfair Display", serif;
        font-size: 24px;
    }

    .order-date {
        color: #888;
        font-size: 14px;
        margin-top: 6px;
    }

    .order-status {
        background: #f1eee8;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 600;
    }

    .customer-info {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 30px;
    }

    .customer-box {
        background: #fafafa;
        padding: 18px;
    }

    .customer-box span {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #999;
        margin-bottom: 7px;
    }

    .customer-box strong {
        font-size: 15px;
        font-weight: 600;
    }

    .order-products {
        border-top: 1px solid #eee;
        padding-top: 20px;
    }

    .order-product {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 15px 0;
        border-bottom: 1px solid #f0f0f0;
    }

    .order-product img {
        width: 75px;
        height: 75px;
        object-fit: cover;
    }

    .order-product-info {
        flex: 1;
    }

    .order-product-info strong {
        display: block;
        margin-bottom: 5px;
    }

    .order-product-info span {
        color: #888;
        font-size: 14px;
    }

    .order-product-price {
        font-weight: 700;
    }

    .order-total {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 25px;
        margin-top: 10px;
        font-size: 18px;
    }

    .order-total strong {
        font-size: 24px;
    }

    .empty-orders {
        text-align: center;
        padding: 80px 20px;
        border: 1px solid #ddd;
    }

    .empty-orders h2 {
        font-family: "Playfair Display", serif;
        font-size: 32px;
        margin-bottom: 10px;
    }

    .empty-orders p {
        color: #888;
        margin-bottom: 25px;
    }

    .empty-orders a {
        display: inline-block;
        background: #222;
        color: white;
        padding: 14px 25px;
        text-decoration: none;
    }

    .clear-orders {
        margin-top: 20px;
        border: 1px solid #ccc;
        background: white;
        padding: 12px 20px;
        cursor: pointer;
    }

    @media (max-width: 800px) {

        .orders-page {
            padding: 100px 5% 50px;
        }

        .orders-header h1 {
            font-size: 40px;
        }

        .customer-info {
            grid-template-columns: 1fr;
        }

        .order-top {
            flex-direction: column;
        }

        .order-product-price {
            font-size: 14px;
        }

    }

</style>

</head><body><header class="header"><a href="index.html" class="logo">
    Casa<span>Vibe</span>
</a>

<nav class="navbar">

    <a href="index.html">
        Home
    </a>

    <a href="products.html">
        Shop
    </a>

    <a href="wishlist.html">
        Wishlist
    </a>

    <a href="cart.html">
        Cart
    </a>

</nav>

</header><main class="orders-page"><div class="orders-header">

    <p class="small-title">
        CASAVIBE MANAGEMENT
    </p>

    <h1>
        Customer Orders
    </h1>

    <p>
        View customer information and recent orders.
    </p>

</div>


<div
    id="orders-container"
    class="orders-container">
</div>

</main><footer class="footer"><div>

    <a href="index.html" class="logo">
        Casa<span>Vibe</span>
    </a>

    <p>
        Furniture for beautiful everyday living.
    </p>

</div>

<p class="copyright">
    © 2026 CasaVibe. All rights reserved.
</p>

</footer><script>

function loadOrders() {

    const container =
        document.querySelector("#orders-container");

    const orders =
        JSON.parse(
            localStorage.getItem("casaOrders")
        ) || [];


    if (!orders.length) {

        container.innerHTML = `

            <div class="empty-orders">

                <h2>
                    No orders yet.
                </h2>

                <p>
                    Customer orders will appear here after checkout.
                </p>

                <a href="products.html">
                    Start Shopping →
                </a>

            </div>

        `;

        return;
    }


    container.innerHTML = "";


    orders.slice().reverse().forEach(function(order, index) {

        const orderNumber =
            orders.length - index;


        let productsHTML = "";

        let total = 0;


        if (order.items && order.items.length) {

            order.items.forEach(function(item) {

                const itemTotal =
                    Number(item.price) * Number(item.quantity);

                total += itemTotal;


                productsHTML += `

                    <div class="order-product">

                        <img
                            src="${item.image}"
                            alt="${item.name}"
                        >

                        <div class="order-product-info">

                            <strong>
                                ${item.name}
                            </strong>

                            <span>
                                Quantity: ${item.quantity}
                            </span>

                        </div>

                        <div class="order-product-price">
                            ₪${itemTotal}
                        </div>

                    </div>

                `;

            });

        }


        container.innerHTML += `

            <div class="order-card">

                <div class="order-top">

                    <div>

                        <div class="order-number">
                            Order #${orderNumber}
                        </div>

                        <div class="order-date">
                            ${order.date || "Date unavailable"}
                        </div>

                    </div>

                    <div class="order-status">
                        Pending
                    </div>

                </div>


                <div class="customer-info">

                    <div class="customer-box">

                        <span>
                            Customer
                        </span>

                        <strong>
                            ${order.customer || "Not provided"}
                        </strong>

                    </div>


                    <div class="customer-box">

                        <span>
                            Email
                        </span>

                        <strong>
                            ${order.email || "Not provided"}
                        </strong>

                    </div>


                    <div class="customer-box">

                        <span>
                            Delivery Address
                        </span>

                        <strong>
                            ${order.address || "Not provided"}
                        </strong>

                    </div>

                </div>


                <div class="order-products">

                    ${productsHTML}

                </div>


                <div class="order-total">

                    <span>
                        Order Total
                    </span>

                    <strong>
                        ₪${total}
                    </strong>

                </div>

            </div>

        `;

    });


    container.innerHTML += `

        <button
            class="clear-orders"
            onclick="clearOrders()">

            Clear All Orders

        </button>

    `;

}


function clearOrders() {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete all orders?"
        );

    if (!confirmDelete) return;


    localStorage.removeItem("casaOrders");

    loadOrders();

}


loadOrders();

</script></body></html>
